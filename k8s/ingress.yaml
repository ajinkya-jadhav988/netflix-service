# Two Ingress objects share ONE internet-facing ALB (same group.name), but each has its own
# health-check path. The AWS Load Balancer Controller turns them into ALB listener rules:
#   /movies*  -> backend  (priority 10, evaluated first)
#   /*        -> frontend (priority 20)
# The browser calls the API on the same origin, so no CORS configuration is needed.
#
# Guardrail ideas (see docs): add `alb.ingress.kubernetes.io/inbound-cidrs: <your-ip>/32` to lock the
# site to your IP, and an ACM certificate (`alb.ingress.kubernetes.io/certificate-arn`) for HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: netflix
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: netflix
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /movies
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /movies
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: netflix
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: netflix
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
