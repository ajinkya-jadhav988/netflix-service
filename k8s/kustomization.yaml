apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netflix

resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicy.yaml

# The deploy pipeline rewrites these with `kustomize edit set image`, pointing at ECR and the git SHA.
images:
  - name: netflix-backend
    newName: netflix-backend
    newTag: set-by-ci
  - name: netflix-frontend
    newName: netflix-frontend
    newTag: set-by-ci
