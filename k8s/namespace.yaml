apiVersion: v1
kind: Namespace
metadata:
  name: netflix
  labels:
    # Guardrail: Pod Security Admission rejects any pod that is not "restricted"
    # (must be non-root, drop all capabilities, no privilege escalation, seccomp on).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Guardrail: every container gets sane defaults even if someone forgets to set resources.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: netflix
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
---
# Guardrail: caps what this namespace can consume (protects node capacity and your bill).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: netflix
spec:
  hard:
    pods: "20"
    requests.cpu: "3"
    requests.memory: 4Gi
    limits.cpu: "6"
    limits.memory: 6Gi
