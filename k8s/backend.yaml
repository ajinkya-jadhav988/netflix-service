apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: netflix
automountServiceAccountToken: false # the app never talks to the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: netflix
  labels:
    app: backend
    app.kubernetes.io/part-of: netflix
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below desired capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: netflix
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: netflix-backend:set-by-ci # CI rewrites this to <account>.dkr.ecr.<region>.amazonaws.com/netflix-backend:<git-sha>
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe: # gives the JVM up to 60s to boot before liveness starts
            httpGet:
              path: /movies
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /movies
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /movies
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp # Tomcat scratch space; root filesystem is read-only
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: netflix
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: netflix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: netflix
spec:
  minAvailable: 1 # node drains/upgrades can never take down every backend pod at once
  selector:
    matchLabels:
      app: backend
